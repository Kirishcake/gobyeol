<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>고양이별</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 스케치북 한 장 위의 고양이별. 무지개다리를 건너 도착. 왼쪽 3D 정원(위에서 내려다보기), 오른쪽 패널. 잉크와 종이 두 색, 색은 고양이에게만. */
:root{
  --paper:#f4f0e7; --paper-2:#ebe6da; --ink:#2a2622; --ink-2:#5f5850; --pencil:#9a9286; --line:#cfc8b9;
  --f-display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3;letter-spacing:-.02em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* hand-drawn borders: slightly uneven radii */
.sketch{border:1.6px solid var(--ink);border-radius:14px 18px 12px 20px/18px 12px 20px 14px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1.6px solid var(--ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.logo{font-family:var(--f-display);font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.here{font-size:.92rem;color:var(--ink-2)}
.logo{white-space:nowrap}
#meBtn{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .row{flex-wrap:nowrap}
@media (max-width:560px){.here{display:none}header.top .row{gap:6px!important}.chip.ico{padding:3px 5px}#meBtn{max-width:6.5em;padding:3px 8px}.logo{font-size:1.05rem}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.6px solid var(--ink);background:var(--paper);padding:7px 15px;border-radius:16px 12px 18px 12px/12px 18px 12px 16px;cursor:pointer;font-size:.93rem}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--ink-2)}

.layout{display:block;padding-block:10px}

.stage{position:relative;height:min(calc(100vh - var(--hh,56px) - 24px),760px);height:min(calc(100dvh - var(--hh,56px) - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),760px);min-height:360px;overflow:hidden;background:var(--paper);touch-action:none}

.stage canvas{display:block;width:100%;height:100%;cursor:pointer}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .44  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--f-display);font-weight:700}
.lb.pet{font-size:.82rem;background:var(--paper);border:1.4px solid var(--ink);border-radius:10px 14px 9px 13px;padding:0 8px;line-height:1.4}

.lb.who{font-size:.76rem;font-weight:500;line-height:1.1;color:var(--ink)}
.lb.who.me{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.lb.bub{font-family:var(--f-hand);font-size:.8rem;font-weight:400;background:var(--paper);border:1.4px solid var(--ink);border-radius:14px 16px 12px 18px;padding:1px 10px;white-space:normal;max-width:180px;width:max-content;text-align:center;overflow-wrap:anywhere;line-height:1.4}
.lb[hidden]{display:none}
.catpop{position:absolute;left:0;top:0;z-index:2;pointer-events:none;display:grid;grid-template-columns:46px minmax(0,1fr);gap:9px;align-items:center;width:max-content;max-width:230px;padding:7px 11px 7px 7px;background:rgb(244 240 231 / .88);border:1.4px solid var(--ink);border-radius:12px 15px 11px 14px;font-size:.78rem;line-height:1.4}
.catpop .cp-ava{width:46px;height:46px;border-radius:50%;border:1.3px solid var(--ink);background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden;background-color:#fff}
.catpop .cp-ava svg{width:36px;height:36px}
.catpop b{font-size:.9rem}
.catpop .cp-tag{overflow-wrap:anywhere}
.catpop .cp-g{color:var(--ink-2)}
.catpop[hidden]{display:none}
.hint{position:absolute;left:12px;bottom:12px;font-family:var(--f-hand);font-size:.82rem;color:var(--ink-2);pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:grid;gap:6px;grid-template-columns:36px 36px}
.zoom #rotReset,.zoom #lookUp{width:auto}
.zoom button{width:36px;height:36px;padding:0;font-size:1.2rem;line-height:1}
.fade{position:absolute;inset:0;background:#fff7e3;opacity:0;pointer-events:none;transition:opacity .45s;z-index:5}
.lb.pet.cat{background:#fffaf0}
.panel.park{background:#f6faef}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}

.entry{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 55%,transparent);padding:20px}
.pintro{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:4;width:min(320px,calc(100% - 32px));text-align:center;font-size:.84rem;line-height:1.55;color:var(--ink);background:rgba(244,240,231,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:14px;padding:10px 14px;pointer-events:none;transition:opacity .6s}
.pintro.out{opacity:0}
.ptimer{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:4;font-size:.78rem;color:var(--ink-2);background:rgba(244,240,231,.75);border:1px solid var(--line);border-radius:999px;padding:2px 10px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptimer.low{color:#8a2c1f;border-color:#d9a79c}
.talkcard{position:absolute;right:12px;top:58px;z-index:5;width:min(300px,calc(100% - 24px));background:var(--paper);padding:14px 16px;display:grid;gap:6px}
.talkcard .tl{margin:0;font-size:.95rem;animation:tlIn .6s ease both}.talkcard .who{display:flex;gap:10px;align-items:center}.talkcard .ava{width:38px;height:38px;border-radius:50%;background-size:cover;background-position:center;border:1.3px solid var(--ink);flex:none;overflow:hidden}
@keyframes tlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.talkcard .tl{animation:none}}
.call-ava{width:84px;height:84px;margin:0 auto;border-radius:50%;background-size:cover;background-position:center;border:1.5px solid var(--ink);overflow:hidden}
.entry .card{background:var(--paper);padding:22px 24px;max-width:340px;display:grid;gap:10px;text-align:center}
.entry h2{font-size:1.45rem}
.entry p{color:var(--ink-2);font-size:.92rem}

.chat{position:absolute;bottom:8px;left:8px;z-index:3;width:min(420px,calc(100% - 110px));max-height:40%;display:flex;flex-direction:column;gap:5px;padding:0;margin:0;background:none;border:0}
.chat .chat-log{background:rgb(244 240 231 / .3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1.2px solid var(--ink);border-radius:12px 15px 11px 14px;padding:6px 9px;transition:opacity .45s,visibility .45s}
.chat.quiet .chat-log{opacity:0;visibility:hidden}
.chat .chat-log{flex:none;max-height:calc(5 * .76rem * 1.4 + 4 * 3px + 14px)}
.chat .talk input{background:rgb(244 240 231 / .65)}
.chat.min{width:auto;max-height:none}
.chat.min .chat-log,.chat.min .talk,.chat.min #chatNote{display:none}
.chat #chatNote{font-size:.76rem}
.quick{position:absolute;top:8px;left:8px;z-index:3;display:flex;flex-wrap:nowrap;align-items:center;gap:4px;max-width:calc(100% - 16px);overflow-x:auto;padding:4px 6px;background:rgb(244 240 231 / .3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
@media (max-width:560px){
  .quick{flex-wrap:wrap;row-gap:4px;overflow:visible;max-width:calc(100% - 16px)}
  .quick button:not(.hot) span{display:none}
  .quick button{padding:3px 5px}
  .quick .qt{flex-basis:auto}
  .chat{width:calc(100% - 96px)}
  .entry h2{font-size:1.2rem}
}
@media (max-height:480px){.stage{min-height:220px}.zoom{grid-template-columns:32px 32px;gap:4px}.zoom .btn{padding:2px}}

.feed{position:absolute;left:8px;top:46px;z-index:3;list-style:none;margin:0;padding:0;display:grid;gap:4px;max-width:calc(50% - 14px);pointer-events:none}
.feed li{font-size:.7rem;line-height:1.35;padding:0 2px;border:0;background:none;color:var(--ink);text-shadow:0 0 3px #f4f0e7,0 0 3px #f4f0e7,0 0 6px #f4f0e7;transition:opacity .6s}
.feed{gap:1px!important}
.feed li b{font-weight:700}
.feed li.out{opacity:0}
.quick .qt{font-size:.68rem;color:var(--ink);line-height:1.3;white-space:nowrap;padding:0 2px 0 4px;font-weight:700}
.quick .qt:not(:first-child){border-left:1.2px dashed var(--pencil);margin-left:2px;padding-left:7px}
.quick .qrow{display:contents}
.quick button{display:inline-flex;flex:none;white-space:nowrap;align-items:center;gap:3px;border:1.2px solid var(--ink);background:rgb(244 240 231 / .6);border-radius:10px 12px 9px 11px;padding:2px 7px 2px 4px;font-size:.74rem;cursor:pointer;line-height:1.5}
.quick button:hover{background:var(--paper-2)}
.quick button:disabled{opacity:.45;cursor:default}
.quick button.hot{background:#fde6c8;border-width:2px}
.quick button svg{width:17px;height:17px;flex:none}
.letter-box{width:min(460px,100%);background:#fbf7ee}
.catletter{font-size:.98rem;line-height:1.85;white-space:pre-wrap;padding:6px 2px;background:repeating-linear-gradient(transparent 0 1.8rem,var(--line) 1.8rem calc(1.8rem + 1px));overflow-wrap:anywhere}
.catletter .sign{display:block;text-align:right;margin-top:8px}
.dot-new{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d9824a;vertical-align:2px;margin-left:4px}
.chat-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chat-head h2{font-size:.92rem}
.chat .talk input{padding:6px 10px;font-size:.88rem}
.chat .talk .btn{padding:5px 12px;font-size:.85rem}
.chat-log li{font-size:.76rem!important;line-height:1.4!important;gap:5px!important}
.chat-log{gap:3px!important;min-height:30px!important}
.chat .chat-head h2{font-size:.8rem}
.chat .chip{padding:1px 8px;font-size:.74rem}
.chat .talk input{padding:4px 8px!important;font-size:.78rem!important}
.chat .talk .btn{padding:3px 9px!important;font-size:.76rem!important}
.chat #chatNote{font-size:.7rem!important}
.chat-log{list-style:none;margin:0;padding:0;flex:1;min-height:60px;overflow-y:auto;display:grid;gap:6px;align-content:start}
.chat-log li{display:flex;gap:8px;align-items:baseline;font-size:.9rem;line-height:1.5;min-width:0}
.chat-log li b{flex:none;font-weight:700}
.chat-log li span{overflow-wrap:anywhere;min-width:0}
.chat-log li time{flex:none;margin-left:auto;font-size:.72rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chat-log li em{font-style:normal;font-size:.7rem;border:1px solid var(--ink-2);border-radius:6px;padding:0 4px;color:var(--ink-2);flex:none}
.chat-log li.act span{color:var(--ink-2)}
.chat-log li.me b{text-decoration:underline;text-underline-offset:3px}
.chat-log .empty{color:var(--ink-2);font-size:.88rem}
.talk{display:flex;gap:8px}
.talk input{flex:1;min-width:0}

.panelbox{position:fixed;z-index:8;right:max(24px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + var(--hh,56px) + 58px);width:min(330px,calc(100vw - 48px));max-height:min(62vh,560px);background:rgba(244,240,231,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(42,38,34,.14);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
.panelbox[hidden]{display:none}
.panelbox .pclose{position:absolute;top:6px;right:8px;z-index:1;width:28px;height:28px;border:1.2px solid var(--ink);border-radius:50%;background:rgba(244,240,231,.9);cursor:pointer;font-size:1rem;line-height:1}
.panel{display:grid;gap:12px;padding:14px 16px;padding-top:16px;overflow:auto;overscroll-behavior:contain}
.panel > :first-child{padding-right:32px}
.panelbox .panel h2{font-size:1.15rem}.panelbox .panel h3{font-size:.92rem}
.panelbox .panel textarea,.panelbox .panel input[type=text],.panelbox .panel input[type=date]{background:rgba(244,240,231,.85)}
@media (max-width:700px){.panelbox{left:8px;right:8px;top:auto;bottom:var(--pb,70px);width:auto;max-height:34vh;max-height:34dvh}}
.panel h2{font-size:1.45rem}
.panel h3{font-size:1rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h3 small{font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:.9rem}
.who{display:flex;gap:14px;align-items:center}
.ava{width:70px;height:70px;border-radius:50% 46% 52% 48%;flex:none;border:1.6px solid var(--ink);background-size:cover;background-position:center;display:grid;place-items:center}
.ava svg{width:52px;height:52px}
.ava-wrap{position:relative;flex:none}
.profile-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ava.big{width:92px;height:92px}
.ava.big svg{width:68px;height:68px}
.pc-text{display:grid;gap:3px;min-width:0}
.pc-guard{font-size:.9rem}
.pc-tag{font-size:.95rem;overflow-wrap:anywhere}
.ava-edit{position:absolute;right:-6px;bottom:-4px;width:28px;height:28px;border-radius:50%;border:1.4px solid var(--ink);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.ava-edit svg{width:15px;height:15px}
.ava-edit:hover{background:var(--paper-2)}
.ava-edit:focus-within{outline:2px dashed var(--ink);outline-offset:2px}
.album-ov{position:fixed;inset:0;z-index:30;background:rgb(42 38 34 / .45);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.album-box{background:var(--paper);width:min(920px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:16px}
.album-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.album-head h2{font-size:1.35rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph{position:relative;padding:0;border:1.4px solid var(--ink);border-radius:10px 13px 9px 12px;overflow:hidden;background:var(--paper-2);cursor:pointer;aspect-ratio:1;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .star{position:absolute;left:6px;top:6px;font-size:.7rem;background:var(--ink);color:var(--paper);border-radius:8px;padding:0 6px}
.ph .cap{position:absolute;left:0;right:0;bottom:0;font-size:.72rem;background:rgb(244 240 231 / .9);padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.upload{display:grid;place-items:center;align-content:center;gap:4px;border:1.4px dashed var(--ink);border-radius:10px 13px 9px 12px;aspect-ratio:1;cursor:pointer;color:var(--ink-2);font-size:.85rem;text-align:center;padding:8px}
.upload:hover{background:var(--paper-2)}
.upload:focus-within{outline:2px dashed var(--ink);outline-offset:2px}
.empty-album{color:var(--ink-2);font-size:.92rem;padding:24px 0;text-align:center}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 16px) / 3);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.strip>*{aspect-ratio:1;scroll-snap-align:start;min-width:0}
.strip .ph{width:100%}
.strip .upload{aspect-ratio:1;font-size:.78rem}
.panelbox .ava.big{width:64px;height:64px}.panelbox .ava.big svg{width:48px;height:48px}.panelbox .strip{grid-auto-columns:calc((100% - 16px) / 3.4)}.panelbox .profile-card{gap:12px}
.strip-nav{display:flex;gap:4px}
.strip-nav button{width:28px;height:28px;padding:0;border-radius:50%}
.gal{margin-top:18px;padding:18px;display:grid;gap:14px;background:var(--paper)}
.gal-head{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.gal-head h2{font-size:1.25rem}
.gal-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.gal-tabs .chip{white-space:nowrap}
.allgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
@media (max-width:480px){.allgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.allgrid .ph .who-cat{position:absolute;left:6px;top:6px;font-size:.7rem;background:var(--paper);border:1.2px solid var(--ink);border-radius:8px;padding:0 6px}
.gallery{display:grid;gap:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.thumb{flex:0 0 78px;height:78px;padding:0;border:1.4px solid var(--ink);border-radius:9px 12px 8px 11px;overflow:hidden;cursor:pointer;background:var(--paper-2);scroll-snap-align:start;opacity:.7}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{opacity:1;outline:2.5px solid var(--ink);outline-offset:2px}
.thumbs .upload{flex:0 0 78px;height:78px;aspect-ratio:auto;font-size:.72rem;line-height:1.3}
.cap-line{font-size:.95rem;min-height:1.5em}
.lightbox{display:grid;gap:12px}
.lightbox .frame{position:relative;border:1.4px solid var(--ink);border-radius:12px 15px 11px 14px;overflow:hidden;background:#1d1a17;display:grid;place-items:center;max-height:62vh}
.lightbox .frame img{max-width:100%;max-height:62vh;object-fit:contain;display:block}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;padding:0;background:var(--paper)}
.lightbox .nav.prev{left:8px}.lightbox .nav.next{right:8px}
.lightbox .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.chip.visit-chip{display:inline-flex;align-items:center;gap:4px;background:var(--ink)!important;color:var(--paper)!important;font-weight:700}.chip.visit-chip svg{width:18px;height:18px;background:var(--paper);border-radius:50%}
.minifacts{font-size:.76rem;color:var(--ink-2);margin:-4px 0 0}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FL=['국화','해바라기','들꽃'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const dd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>isDate(s)?s.replaceAll('-','.'):'';
const todayStr=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};
const num=v=>Math.max(0,Math.min(1e6,Math.floor(Number(v)||0)));
const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function together(p){if(!isDate(p.born)||!isDate(p.left))return '';const a=dd(p.born),b=dd(p.left);let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;if(m<0)return '';const y=Math.floor(m/12),mo=m%12;return y?`${y}년${mo?` ${mo}개월`:''}`:`${mo}개월`}
const since=p=>isDate(p.left)?Math.round((TODAY-dd(p.left))/864e5):null;
function nextAnniv(p){if(!isDate(p.left))return null;const l=dd(p.left);let n=new Date(TODAY.getFullYear(),l.getMonth(),l.getDate());if(n<TODAY)n.setFullYear(n.getFullYear()+1);return Math.round((n-TODAY)/864e5)}

/* the only colour in the garden */
const COATS={
 '치즈':{body:'#e6a35a',accent:'#f6e4c8',eye:'#c79c25',stripe:'#c47a32'},
 '치즈 화이트':{body:'#e6a35a',accent:'#faf6ee',eye:'#c79c25',stripe:'#c47a32'},
 '고등어':{body:'#8a8376',accent:'#e6dfd0',eye:'#8aa83a',stripe:'#4c463e'},
 '고등어 화이트':{body:'#8a8376',accent:'#faf6ee',eye:'#8aa83a',stripe:'#4c463e'},
 '실버 태비':{body:'#b9bcbf',accent:'#e9eaea',eye:'#7fae4a',stripe:'#3f4245'},
 '삼색':{body:'#f4efe5',accent:'#f4efe5',eye:'#cf9f2a',patch:['#d8883b','#2f2a26']},
 '카오스':{body:'#3a302b',accent:'#3a302b',eye:'#d0a02a',patch:['#b8682e','#6a4428']},
 '턱시도':{body:'#302b28',accent:'#f4efe5',eye:'#b7c13a'},
 '젖소':{body:'#f6f3ec',accent:'#f6f3ec',eye:'#c9b33a',patch:['#2d2926','#2d2926']},
 '흰 고양이':{body:'#f8f5ef',accent:'#f8f5ef',eye:'#6aa3d4'},
 '검은 고양이':{body:'#2c2826',accent:'#2c2826',eye:'#ddb320'},
 '회색 고양이':{body:'#8f949a',accent:'#a7acb1',eye:'#d5a233'},
 '크림':{body:'#ecd3a8',accent:'#f7ecd8',eye:'#c8962e',stripe:'#d4ae78'},
 '코리안숏헤어':{body:'#8a8376',accent:'#e6dfd0',eye:'#a7a43a',stripe:'#4c463e',breed:1},
 '러시안블루':{body:'#8e9aa7',accent:'#aab4be',eye:'#58a866',breed:1},
 '브리티시 쇼트헤어':{body:'#8e98a4',accent:'#9fa8b2',eye:'#e09a2a',fluffy:1.12,breed:1},
 '스코티시 폴드':{body:'#c9c3b8',accent:'#efe9de',eye:'#d5a233',stripe:'#8a8376',fold:1,breed:1},
 '먼치킨':{body:'#d9a464',accent:'#f4e6cf',eye:'#9a7b2a',short:1,breed:1},
 '아메리칸 숏헤어':{body:'#c3c5c6',accent:'#ebebea',eye:'#7fae4a',stripe:'#2f3133',breed:1},
 '샴':{body:'#f1e6d2',accent:'#f6efe2',eye:'#4f8fd6',point:'#4a3a30',breed:1},
 '래그돌':{body:'#f3ece0',accent:'#fbf8f2',eye:'#3f7fd0',point:'#7a6656',fluffy:1.12,breed:1},
 '페르시안':{body:'#f4f0e9',accent:'#f4f0e9',eye:'#c58a2a',fluffy:1.2,breed:1},
 '메인쿤':{body:'#7b6450',accent:'#e4d8c4',eye:'#a5a034',stripe:'#3d3026',fluffy:1.2,tuft:1,breed:1},
 '노르웨이 숲':{body:'#9a8e80',accent:'#efe8dc',eye:'#8aa83a',stripe:'#5a5046',fluffy:1.18,tuft:1,breed:1},
 '아비시니안':{body:'#b9733e',accent:'#d9a06a',eye:'#a8972c',breed:1},
 '벵갈':{body:'#d6a25a',accent:'#f1dfbd',eye:'#8aa83a',spots:'#4a3424',breed:1},
 '스핑크스':{body:'#e9c4b4',accent:'#f0d2c5',eye:'#8ab04a',bigEar:1,breed:1},
 '터키시 앙고라':{body:'#fbf9f5',accent:'#fbf9f5',eye:'#5aa0d8',eye2:'#d8b13a',fluffy:1.1,breed:1},
 '봄베이':{body:'#1f1c1b',accent:'#1f1c1b',eye:'#e2a21e',breed:1},
};
const coatOf=c=>COATS[c]?c:'치즈';
/* the star and its rainbow bridge */
const STAR_R=32,BR_A=51,BR_B=30.5,BR_H=3.4,BR_W=1.9,TREE_R=6;
const onBridge=(x,z)=>Math.abs(x)<BR_W&&z>BR_B-.5&&z<BR_A+1.5;
const HILL_H=4.6,HILL_R=27.5;
function hill(x,z){const r=Math.hypot(x,z);return r>=HILL_R?0:HILL_H*(1+Math.cos(Math.PI*r/HILL_R))/2}
function heightAt(x,z){if(!onBridge(x,z))return hill(x,z);const t=Math.min(1,Math.max(0,(BR_A-z)/(BR_A-BR_B)));return BR_H*Math.sin(Math.PI*t)}
const PARK_R=30,VISIT_MS=3*60*1000;
// the cats' own meadow lies outside the fence; the visiting cat slips in under the rails here
// the natural pond in the middle of the park, with a tiny fountain bubbling up from rocks at its centre
const FT_R=5.4,FT_IN=5.8;
// filled in when the park is built: trees and benches nobody should walk through, and the bench seats
const PARK_SOLIDS=[],PARK_BENCHES=[];
const CD_A=.32,doorPt=r=>({x:Math.sin(CD_A)*r,z:Math.cos(CD_A)*r}),gatePt=r=>({x:0,z:r});
const allowedStar=(x,z)=>Math.hypot(x,z)<=STAR_R-1.2||onBridge(x,z);

const S={db:null,user:null,room:null,assets:null,myId:null,me:null,isOwner:false,canWrite:false,
  docs:{},ex:null,mine:null,dirty:0,loaded:false,slow:false,
  entered:false,at:'plaza',say:'',sayAt:0,peers:[],names:{},lastAct:{},view:'pet',confirmDel:false,
  pos:{x:0,z:BR_A+1},holdUntil:0,makeSlot:null,giftChuru:0,bowPeers:{},target:null,face:Math.PI,bowUntil:0,crossing:false,zone:'star',walk:null};
function allowed(x,z){if(S.zone==='park'){const r=Math.hypot(x,z);return r<=PARK_R-1.2&&r>=FT_IN}return allowedStar(x,z)}

/* ---------- data ---------- */
function allDocs(){const d={...S.docs};if(S.myId&&S.mine)d[S.myId]=S.mine;return d}
function petList(){
  const out=[];
  const add=(owner,pets,isEx)=>{if(!pets||typeof pets!=='object')return;for(const [id,p] of Object.entries(pets)){
    if(!p||typeof p!=='object'||!str(p.name,20))continue;
    if(p.kind&&p.kind!=='고양이')continue; // 고양이 추모관
    out.push({id,owner,isEx,key:(isEx?'ex':owner)+'~'+id,name:str(p.name,20),coat:coatOf(p.coat),breed:str(p.breed,30),guardian:str(p.guardian,12),tagline:str(p.tagline,40),born:p.born,left:p.left,story:str(p.story,600),
      photo:/^[A-Za-z0-9_-]{4,80}$/.test(p.photo||'')?p.photo:null,createdAt:Number(p.createdAt)||0,slot:Number.isInteger(p.slot)?p.slot:null,
      letters:Array.isArray(p.letters)?p.letters.filter(l=>l&&typeof l.t==='string').slice(0,100):[],
      photos:Array.isArray(p.photos)?p.photos.filter(x=>x&&/^[A-Za-z0-9_-]{4,80}$/.test(x.id||'')).slice(0,200).map(x=>({id:x.id,cap:str(x.cap,80),at:Number(x.at)||0})):[]})}};
  if(S.ex)add('ex',S.ex.pets,true);
  for(const [uid,d] of Object.entries(allDocs()))add(uid,d&&d.pets,false);
  const hid=modList('hid');
  return out.filter(p=>!hid.includes(p.key)||p.owner===S.myId||S.isOwner).map(p=>hid.includes(p.key)?Object.assign(p,{hidden:true}):p).sort((a,b)=>a.createdAt-b.createdAt||(a.key<b.key?-1:1));
}
function modList(k){const v=S.ban&&S.ban[k];return Array.isArray(v)?v:[]}
function blockOf(id){if(!id)return null;const b=modList('blk').find(x=>x&&x.id===id);return b&&(!b.until||b.until>Date.now())?b:null}
async function saveMod(fn){if(!S.db||!S.isOwner)return false;const cur=Object.assign({},S.ban||{});fn(cur);cur.at=Date.now();try{await S.db.doc('examples/banned').set(cur);return true}catch(_){toast('저장하지 못했어요');return false}}
function totals(key){
  const t={fly:0,water:0,visits:0,weeded:0,flowers:{국화:0,해바라기:0,들꽃:0},seeds:[]};
  const add=(by,tr)=>{const x=tr&&typeof tr==='object'?tr[key]:null;if(!x||typeof x!=='object')return;t.fly+=num(x.fly);t.water+=num(x.water);t.visits+=num(x.visits);{const wd=Number(x.weededAt);if(Number.isFinite(wd)&&wd<=Date.now()+6e4)t.weeded=Math.max(t.weeded||0,wd)}
    FL.forEach(k=>t.flowers[k]+=num(x.flowers&&x.flowers[k]));if(Array.isArray(x.seeds))x.seeds.slice(0,30).forEach(s=>{if(s&&typeof s.t==='string')t.seeds.push({t:s.t.slice(0,60),at:Number(s.at)||0,by})})};
  if(S.ex)add(null,S.ex.trib);
  for(const [uid,d] of Object.entries(allDocs()))add(uid,d&&d.trib);
  t.seeds.sort((a,b)=>b.at-a.at);return t;
}
const stageOf=w=>Math.min(4,Math.floor(w/3));
const WEED_MS=15*60*1000,WEED_MAX=5;
function weedsOf(p,t){t=t||totals(p.key);const base=Math.max(p.createdAt||0,t.weeded||0);return Math.max(0,Math.min(WEED_MAX,Math.floor((Date.now()-base)/WEED_MS)))}

// phone photos come as HEIC or very large files: turn them into a modest JPEG first
async function prepImage(f){
  if(/^image\/(png|jpeg|gif|webp)$/.test(f.type)&&f.size<6e6)return f;
  const toJpeg=(src,w,h)=>{const sc=Math.min(1,2048/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.88))};
  try{const bmp=await createImageBitmap(f);const b=await toJpeg(bmp,bmp.width,bmp.height);if(b)return b}catch(_){}
  try{const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const b=await toJpeg(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(url);if(b)return b}catch(_){}
  return /^image\/(png|jpeg|gif|webp)$/.test(f.type)&&f.size<20e6?f:null;
}

async function uploadImages(files,onEach){
  if(!S.assets){toast('지금은 사진을 올릴 수 없어요. 새로고침한 뒤 다시 해 주세요');return []}
  const out=[];let i=0;
  for(const f of files){i++;if(f.type&&!/^image\//.test(f.type)&&!/\.(heic|heif)$/i.test(f.name||''))continue;onEach&&onEach(i,files.length);
    const b=await prepImage(f);if(!b){toast('이 사진은 열 수 없어요. JPG나 PNG로 바꿔서 올려 주세요');continue}
    let r=null;
    for(let tries=0;tries<2&&!r;tries++){try{r=await S.assets.upload(b,{type:b.type||'image/jpeg'})}catch(e){const c=e&&e.code;if(c==='store_unavailable'&&!tries){await new Promise(z=>setTimeout(z,900));continue}toast(UPLOAD_ERR[c]||'사진을 올리지 못했어요. 다시 해 주세요');break}}
    if(r)out.push(r.id)}
  return out;
}

function petSpots(pets){
  const spots=new Map(),used=new Set();
  pets.forEach(p=>{if(Number.isInteger(p.slot)&&SLOTS[p.slot]&&!used.has(p.slot)){used.add(p.slot);spots.set(p.key,SLOTS[p.slot])}});
  let next=0;pets.forEach(p=>{if(spots.has(p.key))return;while(used.has(next))next++;if(SLOTS[next]){used.add(next);spots.set(p.key,SLOTS[next])}});
  spots.used=used;return spots;
}

function season(){const m=new Date().getMonth()+1;return m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter'}
function letterTo(p){return guardianOf(p)&&p.owner===S.myId?guardianOf(p):(S.nick||'집사')}
function composeLetter(p,n,log,prev){
  const used=prev.join('\n'),fill=t=>t.replace(/\{to\}/g,letterTo(p)).replace(/\{n\}/g,n);
  const pick=pool=>{const a=(LB[pool]||[]).map(fill);const fresh=a.filter(x=>!used.includes(x));return rnd1(fresh.length?fresh:a)};
  const c=COATS[p.coat]||{},L=[];
  // short letters: one line about the visit, one small thing, one goodbye
  L.push(n===1?pick('first'):n===5?pick('fifth'):pick('later'));
  const today=[log.fed&&'fed',log.petted&&'petted',log.played&&'played'].filter(Boolean);
  const trait=c.stripe?'stripe':c.point?'point':c.fold?'fold':c.short?'short':c.patch?'patch':c.fluffy?'fluffy':/검은|봄베이|턱시도/.test(p.coat)?'dark':/흰|페르시안|앙고라/.test(p.coat)?'light':null;
  const mid=today.length?[rnd1(today)]:['shy',season(),'star'].concat(trait?[trait]:[]);
  L.push(pick(rnd1(mid)));
  L.push(pick(Math.random()<.5?'care':'close'));
  return `${pick('open')}\n\n${[...new Set(L)].join('\n')}`;
}
async function claudeLetter(p,n,log,prev,onText){
  if(window.catLetterFn){const did={fed:!!log.fed,petted:!!log.petted,played:!!log.played};
    try{const t=await window.catLetterFn({name:p.name,coat:p.coat,breed:p.breed&&p.breed!==p.coat?p.breed:'',to:letterTo(p),born:fmt(p.born),left:fmt(p.left),story:(p.story||'').slice(0,300),visit:n,did,season:season(),prev:prev.slice(-6).map(t=>t.split('\n').slice(2,3).join('')).filter(Boolean)});if(t&&t.length>10){onText&&onText(t);return t.slice(0,400)}}catch(_){}
    return null}
  if(!S.sample)return null;
  const c=COATS[p.coat]||{},to=letterTo(p);
  const did=[log.fed&&'보호자가 츄르를 먹여 줌',log.petted&&'보호자가 쓰다듬어 줌',log.played&&'낚싯대로 같이 놀았음'].filter(Boolean).join(', ')||'가까이 가지 않고 각자 시간을 보냄';
  const prompt=`너는 무지개다리를 건너 "고양이별"에 사는 고양이야. 오늘 만나러 온 보호자에게 짧은 편지를 써.
- 이름: ${p.name} / 털: ${p.coat}${p.breed&&p.breed!==p.coat?` / 품종: ${p.breed}`:''}
- 보호자를 부르는 이름: ${to}
- 함께한 날: ${fmt(p.born)} ~ ${fmt(p.left)}
- 보호자가 쓴 소개: ${p.story?p.story.slice(0,300):'(없음)'}
- 이번이 ${n}번째 만남, 오늘 있었던 일: ${did}
- 지금 계절: ${{spring:'봄',summer:'여름',autumn:'가을',winter:'겨울'}[season()]}
규칙:
- 한국어 반말, 고양이 시점. '냥'은 많아야 한 번.
- 첫 줄은 "${to}에게"처럼 보호자를 부르는 말로 시작하고, 빈 줄 뒤에 본문 2~3문장. 짧고 담백하게, 한 문장도 길게 늘이지 마.
- 오늘 만난 이야기나 고양이별 일상 중 하나, 그리고 보호자를 응원하는 말 한마디.
- 슬픔을 강요하지 말고 따뜻하고 가볍게. 아픈 기억, 죽음 묘사, 의학 이야기는 쓰지 마.
- 이전 편지와 겹치는 표현이나 소재를 쓰지 마. 이전 편지 첫 문장들: ${prev.slice(-6).map(t=>t.split('\n').slice(2,3).join('')).filter(Boolean).join(' / ')||'(없음)'}
- 서명이나 제목은 쓰지 말고 편지 본문만.`;

   ${S.isOwner&&S.ex?`<div class="note">${S.confirmDel?`<p style="margin-bottom:8px">처음부터 있던 고양이 5마리의 화단을 지울까요?</p><div class="row"><button class="btn" id="exYes">지우기</button><button class="btn" id="exNo">그대로 두기</button></div>`:`고양이별 주인에게만 보여요. <button class="chip" id="exDel">처음부터 있던 화단 지우기</button>`}</div>`:''}`;
  pn.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goTo(b.dataset.go));
  const m=pn.querySelector('#toMake');if(m)m.onclick=()=>{S.view='make';renderPanel()};
  const ed=pn.querySelector('#exDel');if(ed)ed.onclick=()=>{S.confirmDel=true;renderPanel()};
  const en=pn.querySelector('#exNo');if(en)en.onclick=()=>{S.confirmDel=false;renderPanel()};
  const ey=pn.querySelector('#exYes');if(ey)ey.onclick=()=>{S.confirmDel=false;S.db.doc('examples/hall').delete().then(()=>toast('화단을 정리했어요')).catch(()=>toast('화단을 정리하지 못했어요'))};
  renderPresence();
}
function renderMake(pn,ed){
  let coat=ed?ed.coat:'치즈';
  pn.innerHTML=`
   <div class="row" style="justify-content:space-between"><span class="eyebrow">${ed?'고양이 등록':'새 화단'}</span><button class="chip" id="mBack">돌아가기</button></div>
   <h2>${ed?'고양이 등록하기':(S.makeSlot!=null?`${S.makeSlot+1}번 화단에 고양이 등록하기`:'우리 고양이 등록하기')}</h2>
   <form id="makeForm" novalidate>
     <div class="field"><label for="mName">이름</label><input id="mName" type="text" maxlength="12" placeholder="예: 나비"></div>
     <div class="field"><span class="lab">털 무늬</span><div class="chips mCoat">${Object.keys(COATS).filter(k=>!COATS[k].breed).map(k=>`<button type="button" class="chip" data-c="${k}" aria-pressed="${k===coat}"><span class="sw" style="background:${COATS[k].body}"></span>${k}</button>`).join('')}</div></div>
     <div class="field"><span class="lab">품종으로 고르기</span><div class="chips mCoat">${Object.keys(COATS).filter(k=>COATS[k].breed).map(k=>`<button type="button" class="chip" data-c="${k}" aria-pressed="${k===coat}"><span class="sw" style="background:${COATS[k].point?`linear-gradient(90deg,${COATS[k].body} 55%,${COATS[k].point} 55%)`:COATS[k].body}"></span>${k}</button>`).join('')}</div></div>
     <div class="field"><label for="mGuard">보호자 이름</label><input id="mGuard" type="text" maxlength="12" placeholder="예: 키위 언니"></div>
     <div class="field"><label for="mTag">한 줄 소개 (선택)</label><input id="mTag" type="text" maxlength="40" placeholder="예: 창가 햇볕 지킴이"></div>
     <div class="field"><label for="mBreed">품종 (선택)</label><input id="mBreed" type="text" maxlength="30" placeholder="예: 코리안숏헤어"></div>
     <div class="two"><div class="field"><label for="mBorn">처음 만난 날</label><input id="mBorn" type="date"></div>
       <div class="field"><label for="mLeft">무지개다리를 건넌 날</label><input id="mLeft" type="date"></div></div>
     <div class="field"><label for="mStory">고양이 소개</label><textarea id="mStory" maxlength="600" placeholder="좋아하던 자리, 버릇, 함께한 이야기"></textarea></div>
     <div class="field"><label for="mPhoto">${ed?'프로필 사진 바꾸기 (선택)':'대표 사진 (선택)'}</label><input id="mPhoto" type="file" accept="image/*"></div>
     <p class="err" id="mErr" hidden></p>
     <div><button class="btn primary" id="mSubmit">등록하기</button></div>
   </form>`;
  {const g=pn.querySelector('#mGuard');if(g)g.value=ed?(ed.guardian||(ed.owner===S.myId?S.nick:'')||''):(S.nick||'')}
  if(ed){const set=(id,v)=>{const el=pn.querySelector(id);if(el)el.value=v||''};set('#mName',ed.name);set('#mTag',ed.tagline);set('#mBreed',ed.breed);set('#mBorn',isDate(ed.born)?ed.born:'');set('#mLeft',isDate(ed.left)?ed.left:'');set('#mStory',ed.story)}
  pn.querySelector('#mBack').onclick=()=>{S.view='pet';S.makeSlot=null;renderPanel()};
  pn.querySelectorAll('.mCoat .chip').forEach(b=>b.onclick=()=>{coat=b.dataset.c;pn.querySelectorAll('.mCoat .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));const br=pn.querySelector('#mBreed');if(COATS[coat].breed&&br&&!br.value.trim())br.value=coat});
  pn.querySelector('#makeForm').onsubmit=async e=>{
    e.preventDefault();
    const v=id=>pn.querySelector(id).value.trim(),err=pn.querySelector('#mErr');
    const name=v('#mName'),born=v('#mBorn'),left=v('#mLeft');
    let msg='';if(!name)msg='이름을 적어 주세요.';else if(!isDate(born)||!isDate(left))msg='처음 만난 날과 무지개다리를 건넌 날을 골라 주세요.';else if(born>left)msg='처음 만난 날이 떠난 날보다 늦어요. 날짜를 확인해 주세요.';
    err.hidden=!msg;err.textContent=msg;if(msg)return;
    const btn=pn.querySelector('#mSubmit');btn.disabled=true;
    let photo=null;const f=pn.querySelector('#mPhoto').files[0];
    if(f){btn.textContent='사진 올리는 중';const ids=await uploadImages([f]);photo=ids[0]||null;if(!photo)toast('사진은 올리지 못해서 사진 없이 등록할게요. 나중에 화단에서 다시 올릴 수 있어요')}
    if(ed){const cur=petList().find(x=>x.key===ed.key);editPet(cur,mp=>{Object.assign(mp,{tagline:v('#mTag').slice(0,40),guardian:cleanNick(v('#mGuard')),name,coat,breed:v('#mBreed'),born,left,story:v('#mStory')});if(photo){mp.photo=photo;mp.photos=Array.isArray(mp.photos)?mp.photos:[];mp.photos.unshift({id:photo,cap:'',at:Date.now()})}});
      S.view='pet';renderPanel();toast(`${jo(name,'을','를')} 등록했어요`);return}
    if(!ed&&S.makeSlot==null&&firstFreeSlot()===null){err.hidden=false;err.textContent='빈 화단이 남아 있지 않아요.';btn.disabled=false;btn.textContent='등록하기';return}
    const id='p'+Date.now().toString(36);
    const freeNow=petSpots(petList()).used;const slot=(S.makeSlot!=null&&!freeNow.has(S.makeSlot))?S.makeSlot:firstFreeSlot();S.makeSlot=null;
    ensureMine().pets[id]={slot,tagline:v('#mTag').slice(0,40),guardian:cleanNick(v('#mGuard')),name,kind:'고양이',coat,breed:v('#mBreed'),born,left,story:v('#mStory'),photo,photos:photo?[{id:photo,cap:'',at:Date.now()}]:[],createdAt:Date.now(),letters:[]};
    save();S.view='pet';refreshAll();toast(`${name}의 화단이 생겼어요. 첫 물을 줘 보세요`);goTo(S.myId+'~'+id);
  };
}
function refreshAll(){
  W3.ok&&W3.syncWorld();W3.ok&&W3.syncSnow&&W3.syncSnow();renderPresence();
  if(AL.key&&!$('#album').hidden&&!AL.busy&&!(document.activeElement&&document.activeElement.id==='capIn'))renderAlbum();
  if(S.view==='make'||S.view==='edit'||S.view==='me')return;
  if(S.view==='find'){renderFindList();return}
  if(S.view==='person'){renderPresence();return}
  const keep={};['seedIn','letterIn','tagIn','reportText'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  const focus=document.activeElement&&document.activeElement.id;
  renderPanel();
  for(const [id,v] of Object.entries(keep)){const el=document.getElementById(id);if(el)el.value=v}
  if(focus){const el=document.getElementById(focus);if(el&&el.closest('#panel'))el.focus()}
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),2400)}

/* ---------- quick actions, top-left of the garden ---------- */
const BYE_ICON='<svg viewBox="0 0 28 28"><path d="M17 6h5v16h-5M12 9l-5 5 5 5M7 14h11" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const VISIT_ICON='<svg viewBox="0 0 28 28"><path d="M5 22c4-12 14-12 18 0" fill="none" stroke="#e86a5f" stroke-width="1.6"/><path d="M8 22c3-8 9-8 12 0" fill="none" stroke="#5aa6d8" stroke-width="1.6"/></svg>';
let quickSig='';
function quickPeople(){return presentPeople().filter(p=>p.peer!=='me'&&p.zone===S.zone&&(S.zone!=='park'||p.park===S.parkKey)).sort((a,b)=>Math.hypot(a.x-S.pos.x,a.z-S.pos.z)-Math.hypot(b.x-S.pos.x,b.z-S.pos.z))}
function quickTarget(){
  const L=quickPeople();if(!L.length)return null;
  if(S.view==='person'){const t=L.find(p=>p.peer===S.personPeer);if(t)return t}
  if(S.qPick){const t=L.find(p=>p.peer===S.qPick);if(t)return t}
  return L[0];
}
const SNOW_ICON='<svg viewBox="0 0 28 28"><circle cx="14" cy="18" r="6" fill="#fff" stroke="var(--ink)" stroke-width="1.5"/><circle cx="14" cy="8.5" r="4" fill="#fff" stroke="var(--ink)" stroke-width="1.5"/><circle cx="12.6" cy="8" r=".7" fill="var(--ink)"/><circle cx="15.4" cy="8" r=".7" fill="var(--ink)"/><path d="M14 9.4l3 .8-3 .5z" fill="#f08a3c"/></svg>';
function qb(id,icon,label,opt){opt=opt||{};return `<button data-q="${id}" title="${esc(label)}" aria-label="${esc(label)}"${opt.off?' disabled':''}${opt.hot?' class="hot"':''}>${icon}<span>${esc(label)}</span></button>`}
function renderQuick(){
  const el=$('#quick');if(!S.entered||S.crossing){if(!el.hidden){el.hidden=true;quickSig=''}return}
  let h='';
  if(S.zone==='park'){
    const pet=petList().find(x=>x.key===S.parkKey),hc=hostCat();
    const canFeed=S.churu&&hc&&hc.pose==='beg'&&Math.hypot(hc.x-S.pos.x,hc.z-S.pos.z)<1.6;
    const want=hc&&hc.want&&(hc.wantTo==='me'||hc.wantTo===S.myPeer)?hc.want:null;
    h+=`<div class="qt">${jo(esc(pet?pet.name:'고양이'),'과','와')} 함께${want?` · ${want==='pet'?'쓰다듬어 달래요':want==='churu'?'츄르를 달래요':'놀아 달래요'}`:''}</div><div class="qrow">`+
      qb('c:churu',PICON.churu,canFeed?'먹여주기':S.churu?'츄르 넣기':'츄르',{hot:canFeed||want==='churu'})+qb('c:call',PICON.call,'부르기')+qb('c:pet',PICON.pet,'쓰다듬기',{hot:want==='pet'})+
      (()=>{const L=visitLabels(hc);return qb('c:hug',PICON.hug,L.hug)+qb('c:heel',PICON.heel,L.heel)+qb('c:picnic',PICON.picnic,L.picnic)+qb('c:napwith',PICON.napwith,L.napwith)})()+qb('c:wand',PICON.wand,'낚싯대',{off:S.wandUntil>Date.now(),hot:want==='play'})+qb('bye',BYE_ICON,'돌아가기')+'</div>';
  }else{
    const p=petList().find(x=>x.key===S.at);
    h+=`<div class="qt">눈 오는 고양이별</div><div class="qrow">`+(S.roll?qb('snow',SNOW_ICON,`눈덩이 놓기`):qb('snow',SNOW_ICON,'눈 굴리기'))+(mySnowCount()&&!S.roll?qb('snowclear',SNOW_ICON,'내 눈 치우기'):'')+'</div>';
    if(p){const t=totals(p.key);h+=`<div class="qt">${esc(p.name)} 화단</div><div class="qrow">`+qb('a:fly',ICON.fly,`반딧불 ${t.fly}`)+qb('a:water',ICON.water,`물 ${t.water}`)+qb('a:flower',ICON.flower,'꽃 주기')+(weedsOf(p,t)?qb('a:weed',ICON.weed,`잡초 ${weedsOf(p,t)}`):'')+qb('visit',VISIT_ICON,'만나러 가기')+'</div>';}
  }
  const tg=quickTarget();
  const qn=quickPeople().length;
  if(tg)h+=`<div class="qt">${esc(nameOf(tg))}님에게${qn>1?' <button data-q="next" style="padding:0 6px;font-size:.66rem">다른 사람</button>':''}</div><div class="qrow">${['wave','comfort','churu','flower'].map(k=>qb('g:'+k,GICON[k],GIFT[k].label,{off:!S.room})).join('')}</div>`;
  if(!h)h='<div class="qt">화단이나 사람 곁에 가면 여기서 바로 할 수 있어요</div>';
  if(h!==quickSig){quickSig=h;el.innerHTML=h;el.hidden=false}
}
$('#quick').addEventListener('click',e=>{
  const b=e.target.closest('[data-q]');if(!b||b.disabled)return;const q=b.dataset.q,[t,k]=q.split(':');
  if(q==='snow'){S.roll?snowPlace():snowStart();quickSig='';renderQuick();return}
  if(q==='snowclear'){snowClear();quickSig='';renderQuick();return}
  if(t==='c')catAct(k);
  else if(t==='a')act(k);
  else if(q==='visit')goPark(S.at);
  else if(q==='bye')startLeave();
  else if(t==='g'){const tg=quickTarget();if(tg)approachPerson(tg.peer,k)}
  else if(q==='next'){const L=quickPeople(),cur=quickTarget(),i=L.findIndex(p=>cur&&p.peer===cur.peer);S.qPick=L[(i+1)%L.length].peer;if(S.view==='person')S.view='pet',renderPanel()}
  quickSig='';renderQuick();
});
setInterval(renderQuick,400);

/* ---------- boot ---------- */
renderPanel();renderPresence();renderChat();
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,room,assets,sample]=await Promise.all(['db','user','room','assets','sample'].map(use));
  Object.assign(S,{db,user,room,assets,sample});
  if(user){S.myId=await user.id();S.me=await user.me();S.isOwner=await user.isOwner();const c=await user.can('data.write');S.canWrite=!!(db&&S.myId)&&c!==false}
  if(!db){S.loaded=true;renderPanel();renderPresence();return}
  const slowT=setTimeout(()=>{if(!S.loaded){S.slow=true;renderPanel()}},10000);
  let gotPeople=false,gotEx=false;const ready=()=>{if(gotPeople&&gotEx&&!S.loaded){S.loaded=true;clearTimeout(slowT)}};
  db.collection('people').onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{next[d.id]=d.data()});S.docs=next;
    if(S.myId&&!S.dirty)S.mine=next[S.myId]?JSON.parse(JSON.stringify(next[S.myId])):S.mine;
    if(S.mine&&typeof S.mine.nick==='string'&&S.mine.nick&&!S.entered){$('#nickIn').value=cleanNick(S.mine.nick);S.nick=cleanNick(S.mine.nick)}
    else if(S.mine&&S.nick&&!S.mine.nick&&S.canWrite&&S.loaded){S.mine.nick=S.nick;save()}
    if(!snap.metadata.fromCache){gotPeople=true;ready()}
    refreshAll();
  },()=>{gotPeople=true;ready();refreshAll()});
  S.chat={};
  db.collection('chat').onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{next[d.id]=d.data()});if(S.myId&&S.chatDirty&&S.chat[S.myId])next[S.myId]=S.chat[S.myId];
    if(S.myId&&!S.chatDirty)S.chatMine=next[S.myId]&&Array.isArray(next[S.myId].m)?next[S.myId].m.slice():[];S.chat=next;renderChat()},()=>{});
  db.doc('examples/banned').onSnapshot(s=>{S.ban=s.exists?s.data():null;banKey='';catKey='';renderChat()},()=>{});
  db.doc('examples/hall').onSnapshot(s=>{S.ex=s.exists?s.data():null;if(!s.metadata.fromCache){gotEx=true;ready()}refreshAll()},()=>{gotEx=true;ready();refreshAll()});
  if(room){
    S.bowPeers={};
    room.on('gift',handleGift,()=>{});
    room.onPeers(ch=>{
      S.peers=ch.peers;const mine=ch.peers.find(p=>p.sameTab);if(mine)S.myPeer=mine.peer;if(S.view==='person')renderPresence();
      for(const p of ch.peers){if(p.sameTab)continue;const pr=p.presence||{};const at=Number(pr.actAt)||0;const prev=S.lastAct[p.peer];S.lastAct[p.peer]=at;
        if(prev!==undefined&&at&&at!==prev){if((pr.act==='fly'||pr.act==='weed')&&typeof pr.at==='string'&&W3.ok)W3.burstAt(pr.at);if(pr.act==='bow')S.bowPeers[p.peer]=Date.now()+1800}
        if(pr.creq&&typeof pr.creq==='object'){const ra=Number(pr.creq.at)||0,rp=S.lastAct['r'+p.peer];S.lastAct['r'+p.peer]=ra;if(rp!==undefined&&ra&&ra!==rp&&S.walk&&S.zone==='park'&&pr.park===S.parkKey&&['call','pet','wand','feed','hug','heel','picnic','napwith'].includes(pr.creq.k))catAct(pr.creq.k,p.peer)}
        const ca=Number(pr.cactAt)||0,pc=S.lastAct['c'+p.peer];S.lastAct['c'+p.peer]=ca;if(pc!==undefined&&ca&&ca!==pc&&pr.zone==='park'&&S.zone==='park'&&W3.ok)W3.catFx(Number(pr.cx)||0,Number(pr.cz)||0,pr.cact==='pet'?'pet':'treat')}
      const ids=[...new Set(ch.peers.map(p=>p.by||(p.presence&&typeof p.presence.uid==='string'?p.presence.uid:null)).filter(Boolean))];
      refreshNames(ids);renderPresence();
    },()=>{S.room=null;renderPresence()});
  }
  renderPanel();renderPresence();
})();
})();
</script>
